name: smart_campus
description: UniSphere Smart Campus Companion

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  connectivity_plus: ^5.0.0


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  go_router: ^17.2.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  local_auth: ^3.0.1
  flutter_local_notifications: ^21.0.0
  connectivity_plus: ^7.1.1
  intl: ^0.20.2
  path: ^1.9.0
  sensors_plus: ^4.0.2
  workmanager: ^0.9.0+3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Local fonts only — no network dependencies
  fonts:
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

  assets:
    - assets/images/